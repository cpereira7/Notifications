services:
  postgres:
    image: postgres:latest
    container_name: emergency_db
    restart: always
    env_file: env_file.env
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    container_name: event_cache
    env_file: env_file.env
    image: redis:latest
    restart: always
    depends_on:
      - postgres
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"

  pydatagen:
    build: ../application/datagen
    container_name: event_generator
    restart: always
    env_file: env_file.env
    depends_on:
      - postgres
    volumes:
      - ../data:/app/data
  
  datasyncapp:
    build: ../application/datasync
    container_name: event_sync
    env_file: env_file.env
    depends_on:
      - postgres
      - redis
      - pydatagen

  monitor:
    build: 
      context: ../application/
      dockerfile: ./Monitor/Dockerfile
    container_name: event_monitor
    env_file: env_file.env
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=emergency_database;Username=postgres;Password=postgres;
    depends_on:
      - postgres
      - redis